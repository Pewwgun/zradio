name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach DLLs to releases on tags

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm g++-multilib mingw-w64

      - name: Build all four DLLs
        run: ./build.sh

      - name: Show what was built
        run: |
          ls -la bin/
          file bin/*.dll

      - name: Install Wine (to run the Windows tests)
        run: sudo apt-get install -y --no-install-recommends wine64 wine32:i386

      - name: Test (fake engine + real ILuaBase, all four builds)
        env:
          WINEPREFIX: ${{ runner.temp }}/wine
          WINEDEBUG: -all
        run: |
          wineboot -i >/dev/null 2>&1 || true
          tests/run_tests.sh

      - name: Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: gmsv_zradio
          path: bin/*.dll
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.dll
          generate_release_notes: true
