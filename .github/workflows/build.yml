name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach DLLs to releases on tags

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm g++-multilib mingw-w64

      - name: Build all four DLLs
        run: ./build.sh

      - name: Show what was built
        run: |
          ls -la bin/
          file bin/*.dll

      - name: Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: gmsv_zradio
          path: bin/*.dll
          if-no-files-found: error

      - name: Install Wine (to run the Windows tests)
        run: sudo apt-get install -y --no-install-recommends wine wine64 wine32:i386

      - name: Test (fake engine + real ILuaBase, all four builds)
        env:
          WINEPREFIX: ${{ runner.temp }}/wine
          WINEDEBUG: -all
        run: |
          wineboot -i >/dev/null 2>&1 || true
          set +e
          tests/run_tests.sh 2>&1 | tee test.log
          rc=${PIPESTATUS[0]}
          # surface results as annotations (visible on the run page and through the API)
          target=""
          while IFS= read -r line; do
            case "$line" in
              "=== "*) target="${line#=== }" ;;
              FAIL*) echo "::error title=$target::${line}" ;;
              "ALL PASSED"*|FAILED*) echo "::notice title=$target::${line}" ;;
              *"failed"*|*"error"*|*"Error"*|*"not found"*|*"No such"*|*"cannot"*) echo "::warning title=$target::${line}" ;;
            esac
          done < test.log
          { echo '### Test results'; echo '```'; cat test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.dll
          generate_release_notes: true
